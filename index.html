<style>
/* Layout: светлый фон, модульные блоки со скруглением 28–36px. Старт: лаймовый hero → тёмная полоса фактов → заголовок раздела + сетка карточек школ. Квиз: одна карточка 760px. */
:root{
  --lime:#D4FA33; --violet:#644BEF; --violet-hover:#5236E3; --ink:#181424; --white:#FFFFFF;
  --bg:#F6F5F9; --card:#FFFFFF; --line:#E4E1EC; --line-2:#EFEDF4;
  --fg:#181424; --fg-2:#4B4659; --muted:#8A8597;
  --accent:#644BEF; --accent-soft:#EEEBFE; --dark:#181424; --on-dark:#FFFFFF; --on-dark-2:#D4FA33;
  --good:#644BEF; --bad:#D93D45; --mid:#644BEF; --grad:#644BEF;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-xl:32px; --r-lg:24px; --r-md:16px;
  color-scheme:light;
}
body{background:var(--bg);margin:0}
#nt-app,#nt-app *{box-sizing:border-box}
#nt-app{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;font-weight:500;text-align:left;
  display:flex;flex-direction:column;min-height:100vh;font-variant-numeric:tabular-nums}
#nt-app .main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
#nt-app button{-webkit-appearance:none;appearance:none;touch-action:manipulation;font-family:var(--font)}
#nt-app .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
#nt-app .narrow{max-width:760px;width:100%;margin-inline:auto}
#nt-app .split{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
#nt-app p{margin:0}
/* шапка */
#nt-app .top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
#nt-app .brand{font-weight:800;letter-spacing:-.02em;font-size:19px;color:var(--ink)}
#nt-app .brand span{color:var(--violet)}
#nt-app .lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
#nt-app .lang button{border:0;background:none;color:var(--fg-2);font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer}
#nt-app .lang button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
/* типографика */
#nt-app h1{font-size:clamp(24px,6.4vw,44px);line-height:1.05;letter-spacing:-.035em;font-weight:800;margin:0;text-wrap:balance;overflow-wrap:break-word}
#nt-app h2{font-size:clamp(26px,3.6vw,40px);line-height:1.1;letter-spacing:-.03em;font-weight:800;margin:0;text-wrap:balance}
#nt-app h3{font-size:20px;line-height:1.25;letter-spacing:-.015em;font-weight:700;margin:0;text-wrap:balance}
#nt-app .sec-h{font-size:clamp(32px,5.6vw,68px);line-height:1;letter-spacing:-.04em;font-weight:800;margin:24px 0 4px;text-wrap:balance}
#nt-app .sub{color:var(--fg-2)}
#nt-app .eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
#nt-app .stack{display:flex;flex-direction:column;gap:16px}
#nt-app .tight{gap:8px}
#nt-app .center{text-align:center}
#nt-app .note{font-size:13px;color:var(--muted);font-weight:500}
#nt-app .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);padding:24px}
/* кнопки */
#nt-app .btn{font-weight:700;font-size:16px;border:0;border-radius:999px;padding:17px 26px;cursor:pointer;background:var(--ink);color:var(--white);width:100%;text-align:center;text-decoration:none;display:block;line-height:1.25;transition:background .15s ease,transform .15s ease}
#nt-app .btn:hover{transform:translateY(-1px)}
#nt-app .btn.grad,#nt-app .btn.tg{background:var(--violet);color:var(--white)}
#nt-app .btn.grad:hover,#nt-app .btn.tg:hover{background:var(--violet-hover)}
#nt-app .btn.lime{background:var(--lime);color:var(--ink)}
#nt-app .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
#nt-app .btn.ghost:hover{border-color:var(--ink)}
#nt-app .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#nt-app button:focus-visible,#nt-app input:focus-visible,#nt-app a:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
/* старт: лаймовый блок */
#nt-app .hero-l{background:var(--lime);color:var(--ink);border-radius:var(--r-xl);padding:clamp(28px,5vw,64px);display:grid;grid-template-columns:minmax(0,1fr);gap:32px}
#nt-app .hero-l .lead{font-size:clamp(16px,1.6vw,19px);font-weight:500;color:var(--ink);max-width:34em;opacity:.85}
#nt-app .hero-l .btn{max-width:340px}
#nt-app .hfacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:end}
#nt-app .hfact{border-top:1.5px solid rgba(24,20,36,.18);padding-top:12px}
#nt-app .hfact b{display:block;font-size:clamp(36px,5vw,64px);line-height:1;font-weight:800;letter-spacing:-.04em}
#nt-app .hfact span{display:block;font-size:13px;font-weight:600;margin-top:6px;line-height:1.3}
/* полоса доверия */
#nt-app .tband{background:var(--ink);color:var(--white);border-radius:var(--r-xl);padding:22px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
#nt-app .tband span{font-size:15px;font-weight:600;display:flex;gap:10px;align-items:baseline}
#nt-app .tband span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--lime);flex:none;transform:translateY(-2px)}
/* сетка школ */
#nt-app .sgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
#nt-app .sc{border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:10px}
#nt-app .sc b{font-size:14px;line-height:1.3;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
#nt-app .sc small{font-size:14px;line-height:1.45;font-weight:500}
#nt-app .sc.v-violet{background:var(--violet);color:var(--white)}
#nt-app .sc.v-violet small{color:rgba(255,255,255,.85)}
#nt-app .sc.v-white{background:var(--card);border:1px solid var(--line);color:var(--ink)}
#nt-app .sc.v-white small{color:var(--fg-2)}
/* поля */
#nt-app label,#nt-app .lbl{font-size:14px;font-weight:700;display:block;margin-bottom:8px}
#nt-app .opt{font-weight:500;opacity:.7}
#nt-app input{width:100%;font:500 16px var(--font);color:var(--ink);background:var(--white);border:1.5px solid transparent;border-radius:var(--r-md);padding:16px;outline:none;min-height:56px}
#nt-app input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(100,75,239,.18)}
#nt-app .err{color:var(--bad);font-size:13px;font-weight:600;margin-top:6px}
#nt-app .chips{display:flex;flex-wrap:wrap;gap:8px}
#nt-app .chip{font-weight:700;font-size:15px;padding:12px 18px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-width:48px;transition:border-color .15s ease,background .15s ease}
#nt-app .chip:hover{border-color:var(--violet)}
#nt-app .chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--white)}
#nt-app .grades{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
#nt-app .grades .chip{font-size:22px;font-weight:800;padding:18px 0;min-width:0;border-radius:20px}
/* квиз */

/* ============================ ПОДСЧЁТ ============================ */
function mainScores(){
  const got={}, max={};
  SCHOOLS.forEach(s=>{got[s.id]=0;max[s.id]=0;});
  MAIN.forEach((q,k)=>{
    const a=S.ans[k];
    SCHOOLS.forEach(s=>{
      const wy=(q.y||{})[s.id]||0, wn=(q.n||{})[s.id]||0, w=Math.max(wy,wn);
      if(!w) return; max[s.id]+=w;
      if(a===1) got[s.id]+=wy; else if(a===0) got[s.id]+=wn;
    });
  });
  const out={}; SCHOOLS.forEach(s=>{ out[s.id]=max[s.id]?Math.round(got[s.id]/max[s.id]*100):0; }); return out;
}
function scores(){
  const m=mainScores(), out={};
  SCHOOLS.forEach(s=>{ out[s.id]= S.deep[s.id]==null ? m[s.id] : Math.round((m[s.id]+S.deep[s.id])/2); });
  return out;
}
const ranked = () => { const sc=scores(); return SCHOOLS.map(s=>s.id).sort((a,b)=>sc[b]-sc[a]); };
function monthsToExam(){
  const d=new Date(), y = d.getMonth()+1 >= CONFIG.EXAM_MONTH ? d.getFullYear()+1 : d.getFullYear();
  return Math.max(1, (y-d.getFullYear())*12 + (CONFIG.EXAM_MONTH-1) - d.getMonth());
}
function nextDays(){
  const out=[], d=new Date();
  for(let k=1;k<=6;k++){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+k);
    out.push({id:x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"), dm:String(x.getDate()).padStart(2,"0")+"."+String(x.getMonth()+1).padStart(2,"0"), wd:k===1?t("tomorrow"):t("week")[x.getDay()]}); }
  return out;
}

  return `<style>

</style>

async function downloadPdf(btn){
  if(S.pdfBusy) return; S.pdfBusy=true; S.pdfMsg="";
  const label=btn?btn.textContent:""; if(btn){ btn.disabled=true; btn.textContent=t("pdfWait"); }
  let host=null;
  try{
    for(const src of PDF_LIBS) await loadLib(src);
    host=document.createElement("div");
    host.setAttribute("aria-hidden","true");
    host.style.cssText="position:fixed;left:-12000px;top:0;width:794px;z-index:-1;pointer-events:none";
    host.innerHTML=pdfHTML(); document.body.appendChild(host);
    try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
    const doc=new window.jspdf.jsPDF({unit:"pt",format:"a4",compress:true});
    const pages=host.querySelectorAll(".pg");
    for(let k=0;k<pages.length;k++){
      const cv=await window.html2canvas(pages[k],{scale:2,backgroundColor:"#FFFFFF",logging:false,useCORS:true});
      if(k) doc.addPage();
      doc.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",0,0,595.28,841.89);
    }
    const fname=PT[S.lang].file+"-"+(S.name||"").replace(/[^\wА-Яа-яЁёʻ'-]+/g,"_").slice(0,30)+".pdf";
    let handled=false;
    try{ if(window.claude && typeof window.claude.use==="function"){ const dl=await window.claude.use("downloads");
      if(dl){ try{ await dl.save({filename:fname,data:doc.output("blob")}); }catch(e){} handled=true; } } }catch(e){}
    if(!handled) doc.save(fname);
    track("Download",{format:"pdf"});
  }catch(e){ S.pdfMsg=t("pdfErr"); }
  finally{ if(host) host.remove(); S.pdfBusy=false; if(btn){ btn.disabled=false; btn.textContent=label; } if(S.pdfMsg){ const m=$("#nt-pdfmsg"); if(m) m.textContent=S.pdfMsg; } }
}

/* ============================ СОБЫТИЯ ============================ */
function go(scr){ S.screen=scr; render(); top0(); }
function keepForm(){ const n=$("#nt-name"); if(n) S.name=n.value; const p=$("#nt-phone"); if(p) S.phone=digits(p.value); }
function bind(){
  const on=(sel,fn)=>{ const el=$(sel); if(el) el.onclick=fn; };
  on("#nt-start", ()=>{ track("TestStart"); go("grade"); });
  $$("[data-g]").forEach(b=>b.onclick=()=>{ S.grade=+b.dataset.g; S.i=0; go("quiz"); });
  $$("[data-a]").forEach(b=>b.onclick=()=>{
    S.ans[S.i]=+b.dataset.a;
    if(S.i===7) track("TestHalf");
    if(S.i<MAIN.length-1){ S.i++; render(); }
    else { track("TestComplete",{top:sch(ranked()[0]).ru.n}); send("complete"); go(S.lead?"result":"gate"); }
  });
  on("#nt-back", ()=>{
    if(S.screen==="grade") go("intro");
    else if(S.screen==="quiz"){ if(S.i===0) go("grade"); else { S.i--; render(); } }
    else if(S.screen==="deep"){ if(S.di===0) go("result"); else { S.di--; S.dans.pop(); render(); } }
  });
  /* форма */
  const f=$("#nt-lead");
  if(f){
    const ph=$("#nt-phone");
    ph.oninput=()=>{ S.phone=digits(ph.value); ph.value=fmtPhone(S.phone); };
    $("#nt-name").oninput=e=>{ S.name=e.target.value; };
    $$("[data-role]").forEach(b=>b.onclick=()=>{ keepForm(); S.role = S.role===b.dataset.role ? "" : b.dataset.role; render(); });
    on("#nt-tgc", ()=>{ try{ TG.requestContact((ok, res)=>{
      const c = res && res.responseUnsafe && res.responseUnsafe.contact;
      if(c){ S.phone=digits(c.phone_number||""); if(!S.name) S.name=c.first_name||""; render(); }
    }); }catch(e){} });
    f.onsubmit=e=>{
      e.preventDefault(); keepForm(); S.errs={};
      if(S.name.trim().length<2) S.errs.name=1;
      if(S.phone.length!==9) S.errs.phone=1;
      if(Object.keys(S.errs).length) return render();
      S.name=S.name.trim(); S.lead=true; send("lead"); track("Lead",{top:sch(ranked()[0]).ru.n,grade:S.grade},true); go("result");
    };
  }
  /* результат */
  $$("[data-br]").forEach(b=>b.onclick=()=>{ S.branch=b.dataset.br; S.bookErr=false; render(); });
  $$("[data-day]").forEach(b=>b.onclick=()=>{ S.day=b.dataset.day; S.bookErr=false; render(); });
  $$("[data-time]").forEach(b=>b.onclick=()=>{ S.time=b.dataset.time; S.bookErr=false; render(); });
  on("#nt-bookbtn", ()=>{
    if(!S.branch||!S.day||!S.time){ S.bookErr=true; render(); return; }
    S.booked=true; send("booking"); track("Schedule",{branch:S.branch},true); render();
    const bk=$("#nt-book"); if(bk) bk.scrollIntoView({block:"center"});
  });
  $$("[data-deep]").forEach(b=>b.onclick=()=>{ S.dschool=b.dataset.deep; S.di=0; S.dans=[]; track("DeepCheck",{school:S.dschool}); go("deep"); });
  $$("[data-da]").forEach(b=>b.onclick=()=>{
    const s=sch(S.dschool); S.dans.push(+b.dataset.da===s.q[S.di][2]?1:0);
    if(S.di<s.q.length-1){ S.di++; render(); return; }
    S.deep[S.dschool]=Math.round(S.dans.reduce((x,y)=>x+y,0)/s.q.length*100);
    if(S.lead) send("deep");
    go("result");
  });
  on("#nt-share", ()=>track("Share",{channel:"telegram"}));
  on("#nt-tobook", ()=>{ if(S.booked) return; S.booked=true; S.modal=true; send("booking"); track("Schedule",{source:"result"},true); render(); });
  on("#nt-mok", ()=>{ S.modal=false; render(); });
  const ov=$(".ntm"); if(ov){ ov.onclick=e=>{ if(e.target===ov){ S.modal=false; render(); } }; const ok=$("#nt-mok"); if(ok) ok.focus(); }
  const pb=$("#nt-pdf"); if(pb) pb.onclick=()=>downloadPdf(pb);
  on("#nt-copy", ()=>{
    const txt=$("#nt-sharetext").value; const ok=()=>{ S.copied=true; render(); track("Share",{channel:"copy"}); };
    try{ navigator.clipboard.writeText(txt).then(ok, ()=>{ fallbackCopy(); ok(); }); }catch(e){ fallbackCopy(); ok(); }
  });
  on("#nt-again", ()=>{ SID=newSid(); S.booked=false; S.left=false; S.branch=""; S.day=""; S.time=""; S.ans=[]; S.i=0; S.deep={}; S.grade=0; S.copied=false; go("grade"); });
}
function fallbackCopy(){ const ta=$("#nt-sharetext"); if(!ta) return; ta.style.left="0"; ta.select(); try{ document.execCommand("copy"); }catch(e){} ta.style.left="-9999px"; }

function pvBar(){
  const el=document.getElementById("nt-pv"); if(!el) return;
  if(!CONFIG.PREVIEW){ el.remove(); return; }
  const L=[["intro","Старт"],["grade","Класс"],["quiz","Вопрос"],["quizSel","Выбранный ответ"],["gate","Ввод номера"],["result","Результат"],["modal","Окно заявки"],["deep","Уточнение школы"]];
  el.title="Превью: заявки не отправляются";
  el.innerHTML='<span class="pvdot" aria-hidden="true"></span><span>Превью</span><select id="nt-pvsel" aria-label="Перейти к шагу квиза"><option value="">Шаг квиза…</option>'+L.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("")+'</select>';
  const sel=el.querySelector("select"); sel.onchange=()=>{ const v=sel.value; if(v) pvGo(v); sel.value=""; };
}
function pvGo(k){
  const sample=[1,1,0,0,1,1,0,1,0,0,0,0,0,1,0,0];
  S.grade=4; S.modal=false; S.booked=false; S.errs={};
  if(k==="intro"){ S.screen="intro"; }
  if(k==="grade"){ S.screen="grade"; }
  if(k==="quiz"||k==="quizSel"){ S.ans=sample.slice(0,6); S.i=k==="quiz"?6:5; S.screen="quiz"; }
  if(k==="gate"||k==="result"||k==="modal"||k==="deep"){ S.ans=sample.slice(); }
  if(k==="gate"){ S.lead=false; S.name=""; S.phone=""; S.screen="gate"; }
  if(k==="result"||k==="modal"){ S.lead=true; S.name="Dilnoza"; S.phone="901234567"; S.screen="result"; if(k==="modal"){ S.booked=true; S.modal=true; } }
  if(k==="deep"){ S.lead=true; S.dschool="khorezmi"; S.di=2; S.dans=[1,1]; S.screen="deep"; }
  render(); top0();
}

function init(){
  $$("[data-l]").forEach(b=>b.onclick=()=>{ keepForm(); S.lang=b.dataset.l; try{localStorage.setItem("nt-lang",S.lang)}catch(e){} render(); });
  if(TG){ try{ TG.ready(); TG.expand(); }catch(e){} }
  track("ViewContent",{},true);
  pvBar();
  render();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init); else init();
})();
