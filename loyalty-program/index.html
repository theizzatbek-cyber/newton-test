<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Клуб друзей Newton — админка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f6f6f9;--card:#fff;--text:#181424;--muted:#6b6880;--line:#e6e4ee;--soft:#f1f0f6;
  --accent:#644bef;--accent-soft:#eeebfe;--good:#0f9d6b;--good-soft:#e3f6ee;--bad:#d93a3a;--bad-soft:#fdeaea;
  --warn:#b26b00;--warn-soft:#fff3dc;--radius:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#121019;--card:#1b1825;--text:#efedf7;--muted:#a19db3;--line:#2c2839;--soft:#231f30;
  --accent:#8b77ff;--accent-soft:#2a2445;--good:#3ccf97;--good-soft:#173328;--bad:#ff6b6b;--bad-soft:#3a1d22;--warn:#f0b450;--warn-soft:#3a2e17;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
header.top .hrow{display:flex;align-items:center;gap:12px;height:54px;max-width:1360px;margin:0 auto;padding:0 20px}
@media (max-width:959px){header.top .hrow{padding:0 16px}}
.brand{font-weight:800;letter-spacing:.2px}
.brand small{color:var(--muted);font-weight:500;margin-left:6px}
.spacer{flex:1}
.who{color:var(--muted);font-size:13px}
nav.side button{border:0;background:none;padding:7px 12px;border-radius:9px;white-space:nowrap;color:var(--muted);cursor:pointer;font-weight:600;text-align:left}
nav.side button:hover{color:var(--text)}
nav.side button.on{background:var(--accent-soft);color:var(--accent)}
nav.side .gl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);opacity:.8;padding:14px 12px 4px;font-weight:700}
nav.side .gl:first-child{padding-top:0}
main.view{min-width:0;padding:18px 0 60px}
@media (min-width:960px){
  .layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;max-width:1360px;margin:0 auto;padding:0 20px}
  nav.side{position:sticky;top:54px;align-self:start;max-height:calc(100vh - 54px);overflow-y:auto;padding:18px 0 30px;display:flex;flex-direction:column;gap:2px}
  nav.side button{display:flex;align-items:center;justify-content:space-between;width:100%}
}
@media (max-width:959px){
  nav.side{position:sticky;top:54px;z-index:15;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  nav.side::-webkit-scrollbar{display:none}
  nav.side .gl{display:none}
  nav.side button{border-radius:999px}
  main.view{padding:16px 16px 60px}
}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
h2{font-size:20px;margin:4px 0 14px}
h3{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
.kpi{min-width:0}
.kpi .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media (max-width:520px){.kpi .v{font-size:20px}}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.alert{display:flex;gap:10px;align-items:center;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:12px 14px;text-align:left;width:100%}
.alert .n{font-size:22px;font-weight:800;min-width:34px;font-variant-numeric:tabular-nums}
.alert.hot{border-color:var(--warn);background:var(--warn-soft)}
.alert .t{font-weight:600}.alert .d{color:var(--muted);font-size:12px}
.note{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--text);border:1px solid var(--line);margin-bottom:12px}
.note.info{background:var(--accent-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad-soft);border-color:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.tablebox{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;background:var(--soft)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--soft)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:12px}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.bars .r{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center;margin:5px 0}
.bars .track{display:flex;gap:3px;align-items:center}
.bars .b{height:10px;border-radius:3px}
table.weeks th,table.weeks td{background:none;padding:6px 8px}
table.weeks td{width:28%}table.weeks td:first-child{width:16%;color:var(--muted)}
table.weeks .cell{display:flex;align-items:center;gap:8px}
table.weeks .cell .num{min-width:18px}
table.weeks .mini{display:block;height:8px;border-radius:3px;max-width:calc(100% - 26px)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.drawer-bg{position:fixed;inset:0;background:rgba(10,8,20,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.drawer .head{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;z-index:2}
.drawer .body{padding:16px;display:grid;gap:12px}
dl.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;word-break:break-word}
@media (max-width:520px){dl.kv{grid-template-columns:1fr}dl.kv dt{margin-top:6px}}
.timeline{margin:0;padding:0;list-style:none}
.timeline li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.timeline li:last-child{border-bottom:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.err{background:var(--bad);color:#fff}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login .card{padding:22px}
.login h1{font-size:20px;margin:0 0 6px}
.codebox{font-size:22px;letter-spacing:3px;text-align:center;text-transform:uppercase;width:100%;margin:14px 0 10px}
.loading{color:var(--muted);padding:30px 0;text-align:center}
.setrow{display:grid;grid-template-columns:1fr 220px auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .h{font-weight:600}.setrow .d{color:var(--muted);font-size:12px}
@media (max-width:640px){.setrow{grid-template-columns:1fr}}
.callcard{display:grid;gap:8px}
.phone-big{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.script{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px}
.red{color:var(--bad);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chips button .c{opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px;margin:-8px 0 14px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.row2{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{color:var(--text)}
.bc-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.bc-grid{grid-template-columns:1fr}}
.tgprev{background:#d9e6cf;border-radius:14px;padding:14px;min-height:120px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tgprev{background:#1f2a1c}}
.bubble{background:var(--card);border-radius:12px 12px 12px 4px;padding:9px 12px;max-width:100%;white-space:pre-wrap;word-break:break-word;font-size:14px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bubble+.bubble{margin-top:8px}
.bubble .bl{font-size:11px;color:var(--muted);margin-bottom:4px}
.ibtn{margin-top:6px;text-align:center;background:rgba(255,255,255,.55);border-radius:9px;padding:7px;font-weight:600;color:#2b6cb0;font-size:13px}
.progress{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
details.txt{border-bottom:1px solid var(--line)}
details.txt:last-child{border-bottom:0}
details.txt>summary{list-style:none;cursor:pointer;padding:10px 0;display:flex;gap:10px;align-items:baseline}
details.txt>summary::-webkit-details-marker{display:none}
details.txt>summary .lbl{font-weight:600;flex:0 1 auto;min-width:0}
@media (max-width:640px){details.txt>summary{flex-wrap:wrap}details.txt>summary .pv{display:none}}
details.txt>summary .pv{color:var(--muted);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;flex:1}
details.txt[open]>summary .pv{visibility:hidden}
details.txt .ed{padding:0 0 14px;display:grid;gap:10px}
details.txt textarea{min-height:120px;font-size:13px}
.var{display:inline-block;border:1px dashed var(--accent);color:var(--accent);border-radius:7px;padding:1px 7px;font-size:12px;cursor:pointer;margin:0 4px 4px 0;background:none}
.okdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--good);margin-right:6px}
.okdot.bad{background:var(--bad)}.okdot.warn{background:var(--warn)}
.danger{border-color:var(--bad-soft)}
.danger h3{color:var(--bad)}
pre.err{white-space:pre-wrap;word-break:break-word;font-size:12px;margin:0;color:var(--muted)}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <div class="card">
    <h1>Клуб друзей Newton</h1>
    <div class="muted">Вход для админов программы</div>
    <div id="tgLogin" class="hidden" style="margin-top:14px">Входим через Telegram…</div>
    <form id="codeForm">
      <input id="codeInput" class="codebox" type="text" placeholder="КОД" autocomplete="one-time-code" maxlength="12">
      <button class="btn primary" style="width:100%" type="submit">Войти</button>
    </form>
    <p class="muted small" style="margin:14px 0 0">Отправьте боту <b>/web</b> — он пришлёт одноразовый код (действует 10 минут). Войти могут только админы клуба.</p>
    <p id="loginErr" class="red small hidden" style="margin:10px 0 0"></p>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="hrow">
      <div class="brand">Newton <small>Клуб друзей · платформа</small></div>
      <div class="spacer"></div>
      <span class="who" id="who"></span>
      <button class="btn sm" id="logoutBtn">Выйти</button>
    </div>
  </header>
  <div class="layout">
    <nav class="side" id="tabs"></nav>
    <main class="view" id="view"></main>
  </div>
</div>

<div id="drawerBg" class="drawer-bg hidden"></div>
<aside id="drawer" class="drawer hidden"></aside>

<script>
"use strict";
// ?api= is honoured only on localhost (tests): on the live domain a crafted link must not send login codes elsewhere
const API = (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).get("api")) ||
  "https://sndspiruxuxdmbykvxbd.supabase.co/functions/v1/loyalty-bot/api";
const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const S = { token: store.get("nlc_token"), me: null, tab: "dash", counts: {}, managers: [], refFilter: { status: "", manager: "", q: "", kind: "", from: "", to: "" }, memberQ: "" };

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => (Math.round(Number(n) || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const dt = (d) => d ? new Date(d).toLocaleString("ru-RU", { timeZone: "Asia/Tashkent", day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const d0 = (d) => d ? new Date(d).toLocaleDateString("ru-RU", { timeZone: "Asia/Tashkent", day: "2-digit", month: "2-digit", year: "numeric" }) : "—";
const phone = (p) => { if (!p) return "—"; const s = String(p); return s.length === 12 && s.startsWith("998") ? `+998 ${s.slice(3,5)} ${s.slice(5,8)} ${s.slice(8,10)} ${s.slice(10)}` : "+" + s; };
const telLink = (p) => p ? `<a href="tel:+${esc(p)}" class="num">${esc(phone(p))}</a>` : "—";

const STATUS = {
  pending_check: ["Проверяется", ""], lead_created: ["Новый", "acc"], in_progress: ["В работе", "acc"],
  duplicate: ["Уже был в базе", ""], review: ["На проверке", "warn"], hold: ["Оплатил · холд", "good"],
  credited: ["Бонус начислен", "good"], lost: ["Не купил", ""], rejected: ["Отклонён", "bad"], refunded: ["Возврат", "bad"],
};
const VERIFY = { pending: ["Нужен звонок", "warn"], no_answer: ["Не дозвонились", "warn"], ok: ["Звонок ✓", "good"], fail: ["Не подтвердил", "bad"] };
const SOURCE = { friend: "Друг посоветовал", ads: "Реклама", manager: "Уже общался с менеджером", other: "Другое", none: "Не ответил" };
const chip = (map, k) => { const v = map[k]; return v ? `<span class="chip ${v[1]}">${esc(v[0])}</span>` : (k ? `<span class="chip">${esc(k)}</span>` : ""); };
/** 1 номер · 2 номера · 5 номеров */
const pl = (n, [one, few, many]) => { const a = Math.abs(n) % 100, b = a % 10; return `${n} ${a > 10 && a < 20 ? many : b === 1 ? one : b >= 2 && b <= 4 ? few : many}`; };
const monthName = (d) => d ? new Date(d).toLocaleDateString("ru-RU", { timeZone: "Asia/Tashkent", month: "long", year: "numeric" }).replace(" г.", "") : "—";
const KIND = { manager: ["менеджер", "warn"], member: ["участник", ""] };
const RECON = { ok: ["Сверка ✓", "good"], denied: ["Без бонуса (сверка)", "bad"], flag: ["Обратить внимание", "warn"], override: ["Засчитано вручную", "acc"] };
const FIRST = { ok: ["первое обращение", "good"], prior: ["был в базе раньше", "bad"], same_day: ["тот же день — неясно", "warn"] };
const SYSTEM = { analytics: "Analytics", amo_file: "выгрузка amoCRM", crm_file: "база клиентов", amo: "amoCRM", bot: "бот", referral: "рекомендация" };
/** Downloads a file from the API (Excel / CSV). */
async function download(path, fallback) {
  try {
    const r = await api(path);
    const name = ((r.headers.get("content-disposition") || "").match(/filename="([^"]+)"/) || [])[1] || fallback;
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { toast(e.message, true); }
}
const srcChip = (s) => !s ? `<span class="chip">не ответил</span>` : s === "friend" ? `<span class="chip good">друг</span>` : `<span class="chip bad">${esc(SOURCE[s] || s)}</span>`;

function toast(msg, err) {
  document.querySelectorAll(".toast").forEach((x) => x.remove());
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), err ? 6000 : 3500);
}

async function api(path, body) {
  const opt = { method: body ? "POST" : "GET", headers: { "content-type": "application/json" } };
  if (S.token) opt.headers["x-session"] = S.token;
  if (body) opt.body = JSON.stringify(body);
  let r;
  try { r = await fetch(API + path, opt); } catch (e) { throw new Error("Нет связи с сервером"); }
  if (r.status === 401 && !path.startsWith("/auth/")) { logoutLocal(); throw new Error("Сессия истекла — войдите снова"); }
  if (!(r.headers.get("content-type") || "").includes("application/json")) return r; // files: CSV / Excel
  const j = await r.json().catch(() => ({ ok: false, error: "Ошибка сервера" }));
  if (!r.ok || j.ok === false) throw new Error(j.error || j.msg || "Ошибка");
  return j;
}
async function doAction(path, body, after) {
  try {
    const r = await api(path, body);
    toast(r.msg || "Готово");
    if (after) await after(r);
  } catch (e) { toast(e.message, true); }
}

// ---------- login ----------
function showLogin(err) {
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
  const e = $("#loginErr");
  e.textContent = err || ""; e.classList.toggle("hidden", !err);
}
function logoutLocal() { S.token = null; store.set("nlc_token", null); showLogin(); }
async function loginWith(path, body) {
  try {
    const r = await api(path, body);
    S.token = r.token; store.set("nlc_token", r.token);
    history.replaceState(null, "", location.pathname + location.search);
    await boot();
  } catch (e) { showLogin(e.message); }
}
$("#codeForm").addEventListener("submit", (e) => { e.preventDefault(); const c = $("#codeInput").value.trim(); if (c) loginWith("/auth/code", { code: c }); });
$("#logoutBtn").addEventListener("click", async () => { try { await api("/auth/logout", {}); } catch {} logoutLocal(); });

// ---------- shell ----------
const NAV = [
  ["Работа", [["dash", "Обзор"], ["refs", "Лиды"], ["verify", "Проверка звонком", "verify_queue"], ["requests", "Заявки", "requests"],
    ["payouts", "Выплаты", "payouts_open"], ["recon", "Сверка", "recon_waiting"]]],
  ["Люди", [["members", "Участники клуба"], ["users", "Все пользователи"], ["managers", "Менеджеры"]]],
  ["Коммуникации", [["broadcasts", "Рассылки", "broadcasts_sending"], ["texts", "Тексты бота"]]],
  ["Управление", [["protection", "Защита и базы"], ["settings", "Настройки"], ["access", "Админы и доступ"], ["system", "Система"], ["log", "Журнал"]]],
];

        ${x.status_reason ? `<dt>Причина</dt><dd>${esc(x.status_reason)}</dd>` : ""}
        ${x.verify_note ? `<dt>Комментарий</dt><dd>${esc(x.verify_note)}</dd>` : ""}

  const after = async () => { await refreshCounts(); await openRef(id); if (S.tab === "refs") loadRefs(0); if (["verify", "recon"].includes(S.tab)) render(); };
  const A = (body) => doAction("/referral", { id: Number(id), ...body }, after);
  $("#drawer").querySelectorAll("[data-a]").forEach((b) => b.onclick = () => {
    const a = b.dataset.a;
    if (a === "paid") { const amt = $("#payAmt").value.replace(/\D/g, ""); if (!amt) return toast("Введите сумму", true); if (confirm(`Подтвердить оплату ${money(amt)} сум?`)) A({ action: "paid", amount: amt }); }
    if (a === "confirm") { const amt = $("#rpAmt").value.replace(/\D/g, ""); A({ action: "confirm_report", amount: Number(amt) }); }
    if (a === "rejrep") doAction("/requests", { kind: "report", id: Number(id), approve: false }, after);
    if (a === "lost") A({ action: "lost" });
    if (a === "reassign") A({ action: "reassign", manager: $("#reMgr").value });
    if (a === "v_ok") A({ action: "verify", result: "ok", note: $("#vNote").value });
    if (a === "v_fail") { if (confirm("Бонус будет отменён. Продолжить?")) A({ action: "verify", result: "fail", note: $("#vNote").value }); }
    if (a === "v_na") A({ action: "verify", result: "no_answer", note: $("#vNote").value });
    if (a === "rv_ok") A({ action: "review", approve: true });
    if (a === "rv_no") { if (confirm("Отклонить бонус?")) A({ action: "review", approve: false }); }
    if (a === "refund") { if (confirm("Отменить бонус из-за возврата оплаты?")) A({ action: "refund" }); }
    if (a === "note") A({ action: "note", text: $("#rNote").value });
    if (a === "edit") A({ action: "edit", friend_name: $("#eFn").value, child_name: $("#eCn").value, child_grade: $("#eCg").value });
    if (a === "reject") { const reason = $("#rjReason").value.trim(); if (!reason) return toast("Укажите причину", true); if (confirm("Отклонить рекомендацию?")) A({ action: "reject", reason }); }
    if (a === "override") { const reason = $("#ovNote").value.trim(); if (!reason) return toast("Укажите причину", true); if (confirm("Засчитать бонус менеджеру?")) A({ action: "override", reason }); }
  });
}

      <td class="num ${srcShare >= 30 && m.source_flags >= 2 ? "red" : ""}">${m.source_flags || 0}${a ? ` <span class="muted small">(${srcShare}%)</span>` : ""}</td>
      <td class="num">${m.known_flags || 0}</td>
      <td class="num ${m.verify_fail ? "red" : ""}">${m.verify_fail || 0}</td>
      <td class="num">${m.brought || 0}${m.brought ? ` <span class="muted small">· опл. ${m.brought_paid || 0}</span>${m.brought_denied ? ` <span class="red small">· без бонуса ${m.brought_denied}</span>` : ""}` : ""}</td>
      <td><div class="actions" style="flex-wrap:nowrap"><button class="btn sm" data-mg="${m.tg_id}" data-act="${m.manager_active ? "deactivate" : "activate"}">${m.manager_active ? "Снять со смены" : "На смену"}</button>

    const f = fileIn.files[0];
    if (!f && !text.trim()) return toast("Выберите файл или вставьте номера", true);
    b.disabled = true; b.textContent = "Загружаю…";
    let body = { kind: k, text };
    if (f) {
      if (f.size > 8 * 1024 * 1024) { b.disabled = false; b.textContent = "Загрузить"; return toast("Файл больше 8 МБ", true); }
      const buf = new Uint8Array(await f.arrayBuffer());
      let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
      body = { kind: k, filename: f.name, data: btoa(bin) };
    }
    await doAction("/import", body, () => render());
    b.disabled = false; b.textContent = "Загрузить";
  });
  $("#stopAdd").onclick = () => doAction("/stoplist", { action: "add", text: $("#stopText").value, reason: $("#stopReason").value }, () => render());

}

const LANG = { uz: "узбекский", ru: "русский" };
function roleChips(u) {
  const c = [];
  if (u.role === "member") c.push(`<span class="chip good">участник</span>`);
  else if (u.role === "friend") c.push(`<span class="chip acc">друг</span>${u.friend_status ? " " + chip(STATUS, u.friend_status) : ""}`);
  else c.push(`<span class="chip">${u.role === "new" ? "новый" : "гость"}</span>`);
  if (u.is_manager) c.push(`<span class="chip warn">менеджер${u.manager_active ? "" : " · не на смене"}</span>`);
  if (u.is_admin) c.push(`<span class="chip acc">админ</span>`);
  if (u.join_requested_at && u.role !== "member") c.push(`<span class="chip warn">ждёт подтверждения</span>`);
  if (u.blocked) c.push(`<span class="chip bad">заблокирован</span>`);
  if (u.bot_blocked_at) c.push(`<span class="chip bad">остановил бота</span>`);
  return c.join(" ");
}

async function loadUsers(offset) {
  const f = S.userF;
  const r = await api("/users?" + new URLSearchParams({ filter: f.filter, q: f.q, offset, limit: 50 }));
  const chips = $("#uChips"); if (!chips) return;
  chips.innerHTML = Object.entries(r.filters).map(([k, label]) => `<button data-f="${k}" class="${f.filter === k ? "on" : ""}">${esc(label)}<span class="c">${r.counts[k] ?? 0}</span></button>`).join("");
  chips.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { f.filter = b.dataset.f; loadUsers(0); });
  const rows = r.rows.map((u) => `<tr class="click" data-tg="${u.tg_id}">
      <td><b>${esc(u.first_name || "—")}</b>${u.username ? ` <span class="muted small">@${esc(u.username)}</span>` : ""}<div style="margin-top:3px">${roleChips(u)}</div></td>

      <td class="small">${dt(u.updated_at)}<div class="muted">с ${d0(u.created_at)}</div></td></tr>`).join("");
  const box = $("#uList");
  const more = offset + r.rows.length < r.total ? `<button class="btn sm" id="moreU">Показать ещё</button>` : "";
  if (offset === 0) {
    box.innerHTML = `<div class="tablebox"><table><thead><tr><th>Пользователь</th><th>Телефон</th><th>Язык</th><th>Баланс / друзья</th><th>Активность</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5" class="muted">Никого не найдено</td></tr>`}</tbody></table></div>
      <div class="toolbar" style="margin-top:10px" id="uFoot"></div>`;
  } else box.querySelector("tbody").insertAdjacentHTML("beforeend", rows);
  $("#uFoot").innerHTML = `<span class="muted small">Показано ${Math.min(offset + r.rows.length, r.total)} из ${r.total}</span> ${more}`;

}

function tgPreview(text) {
  // shows the Telegram formatting the admin used: b, i, u, s, code, links
  let h = esc(text);
  h = h.replace(/&lt;(\/?)(b|strong|i|em|u|s|code)&gt;/g, "<$1$2>");
  h = h.replace(/&lt;a href=&quot;(https?:\/\/[^&"]+)&quot;&gt;(.*?)&lt;\/a&gt;/g, '<a href="$1" target="_blank" rel="noopener">$2</a>');
  return h;
}

async function runBroadcastLoop(b) {
  S.bcLoop = true;
  const box = $("#bcRun");
  const show = (x) => { if (box) box.innerHTML = `<div class="card" style="margin-bottom:14px"><div class="actions"><b>Рассылка #${x.id} идёт</b><span class="spacer"></span><span class="num">${x.sent + x.failed + x.blocked} / ${x.total}</span></div>
    <div class="progress" style="margin-top:8px"><i style="width:${x.total ? Math.round((x.sent + x.failed + x.blocked) / x.total * 100) : 100}%"></i></div>
    <p class="muted small" style="margin:8px 0 0">Можно закрыть страницу — бот досылает сам каждые 10 минут. Пока страница открыта, отправка идёт быстрее.</p></div>`; };
  show(b);
  while (S.bcLoop && S.tab === "broadcasts") {
    let r; try { r = await api("/broadcasts", { action: "run" }); } catch (e) { toast(e.message, true); break; }
    const x = r.rows.find((y) => y.id === b.id);
    if (!x || x.status !== "sending") { toast(`Рассылка #${b.id} завершена`); refreshCounts(); if (S.tab === "broadcasts") render(); break; }
    show(x);
    await new Promise((res) => setTimeout(res, 800));
  }
}

  draw();

function textItem(i) {
  const changed = i.value.uz !== null || i.value.ru !== null;
  const cur = (l) => i.value[l] ?? i.default[l] ?? "";
  const field = (l) => i.type === "button"
    ? `<input type="text" data-t="${l}" value="${esc(cur(l))}" maxlength="60">`
    : `<textarea data-t="${l}" rows="${Math.min(14, Math.max(3, cur(l).split("\n").length + 1))}">${esc(cur(l))}</textarea>`;
  const one = i.key === "choose_lang";
  return `<details class="txt" data-key="${i.key}"><summary><span class="lbl">${esc(i.label)}</span>${changed ? `<span class="chip acc">изменён</span>` : ""}<span class="pv">${esc(cur("ru").replace(/<[^>]+>/g, "").slice(0, 120))}</span></summary>
    <div class="ed">
      ${i.vars && i.vars.length ? `<div class="small muted">Переменные: ${i.vars.map((x) => `<button type="button" class="var" data-var="{${x.name}}" title="${esc(x.label)}">{${x.name}}</button> <span>${esc(x.label)}</span>`).join(" · ")}</div>` : ""}
      ${one ? `<label class="f">Оба языка в одном сообщении${field("uz")}</label>` : `<div class="row2"><label class="f">Узбекский${field("uz")}</label><label class="f">Русский${field("ru")}</label></div>`}
      <div class="actions"><button class="btn sm primary" data-ts="save">Сохранить</button>${changed ? `<button class="btn sm" data-ts="reset">Вернуть стандартный</button>` : ""}
        <span class="spacer"></span>${i.type === "button" ? "" : `<button class="btn sm" data-ts="test" data-l="uz">Тест мне UZ</button>${one ? "" : `<button class="btn sm" data-ts="test" data-l="ru">Тест мне RU</button>`}`}</div>
    </div></details>`;
}
function bindTexts() {
  let lastField = null;
  $("#tList").querySelectorAll("[data-t]").forEach((el) => el.addEventListener("focus", () => { lastField = el; }));
  $("#tList").querySelectorAll("[data-var]").forEach((b) => b.onclick = () => {
    const box = b.closest("details"), el = lastField && box.contains(lastField) ? lastField : box.querySelector("[data-t]");
    const s = el.selectionStart ?? el.value.length, e2 = el.selectionEnd ?? el.value.length;
    el.value = el.value.slice(0, s) + b.dataset.var + el.value.slice(e2);
    el.focus(); el.selectionStart = el.selectionEnd = s + b.dataset.var.length;
  });
  $("#tList").querySelectorAll("[data-ts]").forEach((b) => b.onclick = async () => {
    const box = b.closest("details"), key = box.dataset.key, item = S.texts.find((x) => x.key === key);
    if (b.dataset.ts === "test") return doAction("/texts", { action: "test", key, lang: b.dataset.l });
    const body = { key };
    if (b.dataset.ts === "reset") { if (!confirm("Вернуть стандартный текст?")) return; body.uz = null; if (key !== "choose_lang") body.ru = null; }
    else box.querySelectorAll("[data-t]").forEach((el) => { body[el.dataset.t] = el.value; });
    try {
      const r = await api("/texts", body);
      toast(r.msg || "Сохранено");
      item.value = r.value;
      box.outerHTML = textItem(item).replace("<details ", "<details open ");
      bindTexts();
    } catch (e) { toast(e.message, true); }
  });
}

    <div class="card" style="margin-bottom:14px"><div class="actions"><h3 style="margin:0">Активные сессии</h3><span class="spacer"></span><button class="btn sm" id="endOthers">Завершить все, кроме моей</button></div>
      <div class="tablebox" style="margin-top:10px"><table><thead><tr><th>Кто</th><th>Вход</th><th>Последнее действие</th><th>Истекает</th><th></th></tr></thead><tbody>
      ${r.sessions.map((s) => `<tr><td>${esc(s.first_name || "—")}${s.mine ? ` <span class="chip acc">эта</span>` : ""}</td><td class="small">${dt(s.created_at)}</td><td class="small">${dt(s.last_seen)}</td><td class="small">${d0(s.expires_at)}</td>
        <td><button class="btn sm" data-end="${s.id}">${s.mine ? "Выйти" : "Завершить"}</button></td></tr>`).join("") || `<tr><td colspan="5" class="muted">Нет</td></tr>`}
      </tbody></table></div></div>
    <div class="card"><h3>Входы и изменения доступа</h3><ul class="timeline">${r.logins.map((e) => `<li><span class="muted small num">${dt(e.created_at)}</span> · ${esc(LOG_LABEL[e.kind] || e.kind)}${e.first_name ? ` — ${esc(e.first_name)}` : ""}</li>`).join("") || `<li class="muted">Пусто</li>`}</ul></div>`;
  v.querySelectorAll("[data-user]").forEach((a) => a.onclick = (e) => { e.preventDefault(); openUser(a.dataset.user); });
  v.querySelectorAll("[data-rot]").forEach((b) => b.onclick = () => { if (confirm("Старый код перестанет работать. Сменить?")) doAction("/settings", { key: b.dataset.rot }, () => render()); });

}

// ---------- system ----------
async function viewSystem(v) {
  const r = await api("/system");
  const t = r.telegram, s = r.stats;
  const cronRows = Array.isArray(r.cron) ? r.cron : [];
  const NAMES = { "loy-poll": "Обработка каждые 10 минут", "loy-weekly": "Недельный отчёт (пн 09:00)" };
  const dot = (ok, warn) => `<span class="okdot ${ok ? "" : warn ? "warn" : "bad"}"></span>`;
  v.innerHTML = `<h2>Система</h2>
    <div class="grid g3" style="margin-bottom:14px">
      <div class="card"><h3>${dot(t.ok && t.webhook_ok)}Telegram-бот</h3><dl class="kv">
        <dt>Бот</dt><dd>${t.bot ? "@" + esc(t.bot) : `<span class="red">${t.configured ? "токен не работает" : "токен не задан"}</span>`}</dd>
        <dt>Подключение</dt><dd>${t.webhook_ok ? "к этому серверу" : `<span class="red">${t.webhook ? "к другому серверу" : "не подключён"}</span>`}</dd>
        <dt>В очереди</dt><dd class="num">${t.pending ?? "—"}</dd>
        ${t.last_error ? `<dt>Последняя ошибка</dt><dd class="small">${esc(t.last_error)}<div class="muted">${dt(t.last_error_at)}</div></dd>` : ""}</dl></div>
      <div class="card"><h3>${dot(cronRows.length && cronRows.every((c) => c.active && c.last_status !== "failed"), !cronRows.length)}Расписание</h3>
        ${cronRows.length ? `<dl class="kv">${cronRows.map((c) => `<dt>${esc(NAMES[c.jobname] || c.jobname)}</dt><dd>${c.active ? "" : `<span class="red">выключено</span> `}${c.last_run ? dt(c.last_run) : "ещё не запускалось"} ${c.last_status ? `<span class="chip ${c.last_status === "succeeded" ? "good" : "bad"}">${esc(c.last_status)}</span>` : ""}</dd>`).join("")}</dl>`
          : `<div class="muted small">${esc(r.cron && r.cron.error ? "Нет доступа к расписанию: " + r.cron.error : "Задачи не найдены")}</div>`}</div>
      <div class="card"><h3>${dot(!s.errors_24h, s.errors_24h < 5)}Работа за сутки</h3><dl class="kv">
        <dt>Пользователей</dt><dd class="num">${s.users} · активны ${s.active_24h}</dd><dt>Сообщений боту</dt><dd class="num">${s.updates_24h}</dd>
        <dt>Ошибок</dt><dd class="num ${s.errors_24h ? "red" : ""}">${s.errors_24h} <span class="muted">· за 7 дней ${s.errors_7d}</span></dd>
        <dt>Версия</dt><dd class="num">${esc(r.version)}${r.crm ? " · amoCRM" : " · без CRM"}</dd></dl></div>
    </div>
    <div class="card" style="margin-bottom:14px"><h3>Ручной запуск</h3><div class="actions">
      <button class="btn" data-sys="poll">Обработать сейчас</button><button class="btn" data-sys="broadcasts">Досылать рассылки</button>
      <button class="btn" data-sys="weekly">Недельный отчёт мне</button><button class="btn" data-sys="webhook">Переподключить бота</button></div>
      <p class="muted small" style="margin:8px 0 0">«Обработать сейчас» — то же, что делает расписание каждые 10 минут: просроченные лиды уходят следующему менеджеру, созревшие бонусы начисляются, карточки уходят в группу продаж. «Переподключить бота» — если бот перестал отвечать.</p></div>
    <div class="card"><h3>Последние ошибки</h3>${r.errors.length ? `<div class="tablebox"><table><thead><tr><th>Когда</th><th>Где</th><th>Ошибка</th></tr></thead><tbody>
      ${r.errors.map((e) => `<tr><td class="small num">${dt(e.created_at)}</td><td class="small">${esc((e.data && (e.data.where || e.data.stage)) || e.kind)}</td><td><pre class="err">${esc((e.data && e.data.error) || JSON.stringify(e.data || {})).slice(0, 400)}</pre></td></tr>`).join("")}</tbody></table></div>` : `<div class="muted">Ошибок нет ✅</div>`}</div>`;
  v.querySelectorAll("[data-sys]").forEach((b) => b.onclick = async () => {
    b.disabled = true; const t0 = b.textContent; b.textContent = "Выполняю…";
    await doAction("/system", { action: b.dataset.sys }, () => { if (b.dataset.sys !== "weekly") render(); });
    b.disabled = false; b.textContent = t0;
  });
}

    <div class="grid g3" style="margin-bottom:14px">

        <td class="small">${dt(x.created_at)}</td>

    </tbody></table></div>` : `<div class="muted">Новых заявок нет ✅</div>`}</div>
    <div class="card"><h3>История</h3>
    ${r.history.length ? `<div class="tablebox"><table><thead><tr><th>#</th><th>Кому</th><th>Сумма</th><th>Карта</th><th>Статус</th><th>Когда</th><th>Кто отметил</th><th>Комментарий</th></tr></thead><tbody>

        <td class="num">${money(x.amount)}</td><td class="num">${x.method === "card" ? (x.card_last4 ? "•••• " + esc(x.card_last4) : "—") : "в оплату"}</td>

// ---------- monthly reconciliation ----------
async function fileBody(kind, f) {
  if (f.size > 8 * 1024 * 1024) throw new Error("Файл больше 8 МБ");
  const buf = new Uint8Array(await f.arrayBuffer());
  let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return { kind, filename: f.name, data: btoa(bin) };
}
async function viewRecon(v) {
  const r = await api("/recon" + (S.reconMonth ? "?month=" + encodeURIComponent(S.reconMonth) : ""));
  S.reconMonth = r.month;
  const up = (sys) => r.uploads.find((x) => x.system === sys);
  const upCard = (kind, title, desc) => { const u = up(kind);
    return `<div class="card"><h3>${title}</h3><p class="muted small" style="margin-top:-4px">${desc}</p>
      <div class="small" style="margin-bottom:8px">${u ? `Загружено: <b>${pl(u.phones, ["номер", "номера", "номеров"])}</b> (${pl(u.n, ["запись", "записи", "записей"])}) · за ${d0(u.from_at)} — ${d0(u.to_at)} · обновлено ${dt(u.imported_at)}` : `<span class="muted">ещё не загружали</span>`}</div>
      <input type="file" accept=".xlsx,.xls,.csv,.txt" data-file="${kind}"><div class="actions" style="margin-top:8px"><button class="btn primary" data-imp="${kind}">Загрузить</button></div></div>`; };
  const rows = r.rows;
  const cnt = (f) => rows.filter(f).length;
  const rule = { pay: "получает бонус как обычно — находка только отмечается", review: "бонус уходит на ручную проверку", block: "такой клиент не засчитывается" }[r.rule] || "";
  v.innerHTML = `<h2>Сверка за месяц</h2>
    <p class="sub">Номера всех оплативших клиентов программы сверяются с историей: выгрузки amoCRM и Analytics, база клиентов, бот. Смотрим <b>первый источник номера</b>, а не текущую сделку. Совпадение — по номеру телефона в едином формате.</p>
    <div class="note info"><b>Менеджер:</b> если номер клиента раньше поступил из Facebook или другого нереферального источника — бонус не начисляется.${r.needs_recon ? " Бонусы менеджеров начисляются только после сверки." : ""}<br><b>Участник:</b> ${esc(rule)}.</div>
    <div class="grid g2" style="margin-bottom:14px">
      ${upCard("amo_file", "Выгрузка amoCRM", "Сделки или контакты с колонками «Телефон», «Дата создания», «Источник». Excel или CSV; можно всю базу — повторы не задваиваются.")}
      ${upCard("analytics", "Выгрузка Analytics", "Лиды с телефоном, датой и источником (utm_source / канал). Загрузите свежую выгрузку перед сверкой.")}
    </div>
    <div class="toolbar"><label class="small">Месяц оплаты <input type="month" id="rMonth" value="${esc(r.month)}"></label>
      <button class="btn primary" id="rRun">Провести сверку · ${esc(r.label)}</button><span class="spacer"></span>
      <button class="btn" id="rXls">Скачать Excel</button><button class="btn" id="rCsv">CSV</button></div>
    <div class="grid g4" style="margin-bottom:12px">
      <div class="card kpi"><div class="l">Оплат по программе</div><div class="v">${rows.length}</div><div class="s">от менеджеров ${cnt((x) => x.referrer_kind === "manager")}</div></div>
      <div class="card kpi"><div class="l">Без бонуса</div><div class="v ${cnt((x) => x.recon_status === "denied") ? "red" : ""}">${cnt((x) => x.recon_status === "denied")}</div><div class="s">менеджер: клиент пришёл раньше</div></div>
      <div class="card kpi"><div class="l">Обратить внимание</div><div class="v">${cnt((x) => x.recon_status === "flag")}</div><div class="s">клиент участника был в базе / тот же день</div></div>
      <div class="card kpi"><div class="l">Ещё не сверены</div><div class="v">${cnt((x) => !x.recon_status)}</div><div class="s">нажмите «Провести сверку»</div></div>
    </div>
    <div class="tablebox"><table><thead><tr><th>#</th><th>Пригласил</th><th>Клиент</th><th>Лид · оплата</th><th>Первый источник номера</th><th>Сверка</th><th>Бонус</th></tr></thead><tbody>
    ${rows.map((x) => `<tr class="click" data-ref="${x.id}"><td class="num">#${x.id}</td>
      <td>${esc(x.ref_name || "—")} ${chip(KIND, x.referrer_kind)}<div class="small muted">ID ${esc(x.referrer_tg)}</div></td>
      <td>${esc(x.friend_name || "—")}<div class="small num">${esc(phone(x.friend_phone))}</div></td>
      <td class="small">${d0(x.created_at)}<div>${d0(x.paid_at)} · <span class="num">${money(x.payment_amount)}</span></div></td>
      <td class="small">${x.first_verdict ? chip(FIRST, x.first_verdict) : ""} ${esc(x.first_source || "")}${x.first_seen_at ? `<div class="muted">${d0(x.first_seen_at)} · ${esc(SYSTEM[x.first_system] || x.first_system || "")}</div>` : ""}</td>
      <td>${x.recon_status ? chip(RECON, x.recon_status) : `<span class="muted small">не проводилась</span>`}${x.recon_note ? `<div class="small muted" style="max-width:240px">${esc(x.recon_note)}</div>` : ""}</td>
      <td>${chip(STATUS, x.status)}${x.bonus_amount ? `<div class="small num">${money(x.bonus_amount)}</div>` : ""}${x.paid_out_at ? `<div><span class="chip good">выплачено</span></div>` : ""}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">За этот месяц оплат по программе нет</td></tr>`}
    </tbody></table></div>
    <p class="muted small">Нажмите на строку — откроется карточка лида. Для отказа менеджеру там есть «Засчитать вручную» (с причиной). Повторная сверка не меняет ручные решения.</p>
    ${r.runs.length ? `<div class="card" style="margin-top:12px"><h3>Проведённые сверки</h3><ul class="timeline">${r.runs.map((x) => `<li><span class="muted small num">${dt(x.run_at)}</span> · за ${esc(monthName(x.month))} — ${esc(x.first_name || "")}: оплат ${x.stats?.total ?? 0}, без бонуса ${x.stats?.denied ?? 0}, внимание ${x.stats?.flag ?? 0}</li>`).join("")}</ul></div>` : ""}`;
  $("#rMonth").onchange = (e) => { S.reconMonth = e.target.value; render(); };
  $("#rRun").onclick = () => doAction("/recon", { action: "run", month: S.reconMonth }, async () => { await refreshCounts(); render(); });
  $("#rXls").onclick = () => download(`/export?kind=recon&month=${S.reconMonth}`, `newton-sverka-${S.reconMonth}.xlsx`);
  $("#rCsv").onclick = () => download(`/export?kind=recon&month=${S.reconMonth}&format=csv`, `newton-sverka-${S.reconMonth}.csv`);
  v.querySelectorAll("tr[data-ref]").forEach((tr) => tr.onclick = () => openRef(tr.dataset.ref));
  v.querySelectorAll("[data-imp]").forEach((b) => b.onclick = async () => {
    const kind = b.dataset.imp, f = v.querySelector(`[data-file="${kind}"]`).files[0];
    if (!f) return toast("Выберите файл", true);
    b.disabled = true; b.textContent = "Загружаю…";
    try { await doAction("/import", await fileBody(kind, f), () => render()); } catch (e) { toast(e.message, true); }
    b.disabled = false; b.textContent = "Загрузить";
  });
}

// ---------- boot ----------
async function boot() {
  if (!S.token) {
    const code = (location.hash.match(/code=([A-Za-z0-9]+)/) || [])[1];
    if (code) return loginWith("/auth/code", { code });
    if (TG) { $("#login").classList.remove("hidden"); $("#tgLogin").classList.remove("hidden"); return loginWith("/auth/telegram", { initData: TG.initData }); }
    return showLogin();
  }
  try {
    const r = await api("/me");
    S.me = r.me; S.crm = !!r.crm;
    $("#who").textContent = (r.me.first_name || "") + (r.me.username ? " · @" + r.me.username : "");
    $("#login").classList.add("hidden");
    $("#app").classList.remove("hidden");
    if (TG) { try { TG.ready(); TG.expand(); } catch {} }
    S.tab = store.get("nlc_tab") || "dash";
    if (!TABS.some(([k]) => k === S.tab)) S.tab = "dash";
    renderTabs();
    render();
    refreshCounts();
  } catch (e) { if (S.token) showLogin(e.message); }
}
boot();
window.addEventListener("hashchange", () => { if (/code=/.test(location.hash)) { S.token = null; store.set("nlc_token", null); boot(); } });
setInterval(() => { if (S.token && !document.hidden) refreshCounts(); }, 60000);
</script>
